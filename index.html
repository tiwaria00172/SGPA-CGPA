<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGPA & CGPA Calculator</title>
<style>
:root {
    --background: #F9FAFB; /* Off-white */
    --primary: #4A90E2; /* Blue main theme */
    --text: #333333; /* Dark gray */
    --input-border: #4A90E2;
    --results-bg: #4A90E222; /* Transparent blue */
}

body {
    font-family: 'Roboto', sans-serif;
    background-color: var(--background);
    margin: 0;
    padding: 0;
    color: var(--text);
}

.container {
    max-width: 600px;
    margin: 40px auto;
    background-color: #ffffff;
    padding: 40px 30px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    border-top: 6px solid var(--primary);
}

h1 {
    text-align: center;
    color: var(--primary);
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 15px 0 5px;
    color: var(--text);
    font-weight: 500;
    font-size: 15px;
}

select, input[type="number"] {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--input-border);
    font-size: 16px;
    box-sizing: border-box;
}

button {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    background-color: var(--primary);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.3s;
}

button:hover {
    background-color: #357ABD; /* Darker blue hover */
}

.results {
    margin-top: 25px;
    background-color: var(--results-bg);
    padding: 20px;
    border-radius: 8px;
    color: var(--text);
    font-weight: 500;
}

.results hr {
    margin: 15px 0;
    border: 0;
    border-top: 1px dashed var(--primary);
}

/* Tabs */
.tab-buttons {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.tab-buttons button {
    flex: 1;
    margin: 5px 5px;
    padding: 10px;
    font-size: 13px;
    min-width: 120px;
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

p.default-values {
    background-color: var(--results-bg);
    border-left: 5px solid var(--primary);
    padding: 12px;
    border-radius: 6px;
    font-size: 14px;
    color: var(--text);
    margin-bottom: 20px;
}

.sem-selector {
    margin: 15px 0;
    padding: 15px;
    background-color: var(--results-bg);
    border-radius: 8px;
}

.sem-selector label {
    margin: 0;
}
</style>
</head>

<script>
function showTab(tabId){
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
}

// Initially show Grade Mode (Semester 3)
showTab('gradeMode');

function calculateGradeSGPA() {
    const credits = { DM:3, MNS:3, DBMS:3, TOC:3, MDM:3, OE:2, PL:2, MNSLab:1, DBMSLab:1 };
    const subjects = ["DM","MNS","DBMS","TOC","MDM","OE","PL","MNSLab","DBMSLab"];
    let totalPoints = 0;
    let totalCredits = 0;

    for(let sub of subjects){
        const gp = parseFloat(document.getElementById(sub).value);
        if(isNaN(gp)){
            document.getElementById('gradeResults').innerHTML = "⚠️ Please select grade for all subjects.";
            return;
        }
        totalPoints += gp * credits[sub];
        totalCredits += credits[sub];
    }

    const incentive = parseFloat(document.getElementById('incentive').value || 0);
    totalPoints += incentive;

    const SGPA = Math.min(totalPoints/totalCredits, 10).toFixed(2);

    document.getElementById('gradeResults').innerHTML = `
        <strong>Total Credits:</strong> ${totalCredits} <br>
        <strong>Total Grade Points:</strong> ${totalPoints.toFixed(2)} <br>
        <strong>Semester 3 SGPA:</strong> <span style="color: var(--primary); font-size: 18px;"><strong>${SGPA}</strong></span>
    `;
}

function calculateGradeSGPASem4() {
    const credits = { 
        S4_IoT: 3, 
        S4_DAA: 3, 
        S4_DAALab: 1, 
        S4_AI: 3, 
        S4_AILab: 1, 
        S4_ProgLab: 2, 
        S4_OE: 2, 
        S4_CEP: 2, 
        S4_VEC: 2, 
        S4_AEC: 1, 
        S4_MDM: 3 
    };
    const subjects = ["S4_IoT", "S4_DAA", "S4_DAALab", "S4_AI", "S4_AILab", "S4_ProgLab", "S4_OE", "S4_CEP", "S4_VEC", "S4_AEC", "S4_MDM"];
    let totalPoints = 0;
    let totalCredits = 0;

    for(let sub of subjects){
        const gp = parseFloat(document.getElementById(sub).value);
        if(isNaN(gp)){
            document.getElementById('gradeResultsSem4').innerHTML = "⚠️ Please select grade for all subjects.";
            return;
        }
        totalPoints += gp * credits[sub];
        totalCredits += credits[sub];
    }

    const incentive = parseFloat(document.getElementById('S4_incentive').value || 0);
    totalPoints += incentive;

    const SGPA = Math.min(totalPoints/totalCredits, 10).toFixed(2);

    document.getElementById('gradeResultsSem4').innerHTML = `
        <strong>Total Credits:</strong> ${totalCredits} <br>
        <strong>Total Grade Points:</strong> ${totalPoints.toFixed(2)} <br>
        <strong>Semester 4 SGPA:</strong> <span style="color: var(--primary); font-size: 18px;"><strong>${SGPA}</strong></span>
    `;
}

function calculateSGPACGPA(){
    const sem1 = parseFloat(document.getElementById('credits1').value);
    const sem2 = parseFloat(document.getElementById('credits2').value);
    const sem3 = parseFloat(document.getElementById('credits3').value);
    const sem4 = parseFloat(document.getElementById('credits4').value);

    const total1 = 20, total2 = 22, total3 = 21, total4 = 23;

    if(isNaN(sem1) || isNaN(sem2) || isNaN(sem3) || isNaN(sem4)){
        document.getElementById('creditResults').innerHTML = "⚠️ Please enter valid credits for all semesters.";
        return;
    }

    const SGPA1 = Math.min((sem1/total1), 10).toFixed(2);
    const SGPA2 = Math.min((sem2/total2), 10).toFixed(2);
    const SGPA3 = Math.min((sem3/total3), 10).toFixed(2);
    const SGPA4 = Math.min((sem4/total4), 10).toFixed(2);
    const CGPA = Math.min(((sem1+sem2+sem3+sem4)/(total1+total2+total3+total4)), 10).toFixed(2);

    const userCreditsSum = sem1 + sem2 + sem3 + sem4;
    const defaultCreditsSum = total1 + total2 + total3 + total4;

    document.getElementById('creditResults').innerHTML = `
        <strong>Total Credits Earned (User Input):</strong> ${userCreditsSum} <br>
        <strong>Total Default Credits:</strong> ${defaultCreditsSum} <br>
        <hr>
        SGPA SEM 1: ${SGPA1} <br>
        SGPA SEM 2: ${SGPA2} <br>
        SGPA SEM 3: ${SGPA3} <br>
        SGPA SEM 4: ${SGPA4} <br>
        <hr>
        Overall CGPA: <span style="color: var(--primary); font-size: 18px;"><strong>${CGPA}</strong></span>
    `;
}
</script>
